# Student pull requests: check the files with the same machine checks that run after the merge. NOTHING is written and no secret is used.
# Fork PRs (the normal case for students) run with a read-only token: the report goes to the run's Summary tab.
# PRs from branches of this repo also get the report as a PR comment.
# First-time contributors need a maintainer to click "Approve and run" (Settings -> Actions -> General -> Fork pull request workflows).
name: pr-check
on:
  pull_request:
    paths: ['intake/**', 'replies/**', 'sources/**', 'media/**', 'inbox/**', 'data/**', 'tools/**', 'config/**', 'site/**']
permissions:
  contents: read
  pull-requests: write   # only used for PRs from this repo; the token of a fork PR is read-only anyway
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/checkout@v4
        with:
          repository: homs-uni/lecture-site-engine
          path: lectures
          sparse-checkout: subjects
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: pip install pymupdf pillow beautifulsoup4
      - name: jsdom for the page tests
        run: npm install --no-save --prefix "$RUNNER_TEMP/node" jsdom pdfjs-dist@3.11.174
      - name: A student PR may only ADD new files in intake/ replies/ sources/ media/ inbox/ (guard script taken from the BASE branch, not from the PR)
        if: ${{ !contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association) }}
        run: |
          git show "origin/${{ github.base_ref }}:tools/check_pr_paths.py" > "$RUNNER_TEMP/check_pr_paths.py"
          python "$RUNNER_TEMP/check_pr_paths.py" --base "origin/${{ github.base_ref }}"
      - name: Lecture text present?
        id: lec
        run: |
          if compgen -G "lectures/subjects/*/*/lectures/*.md" > /dev/null; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The lecture repo has no par*.md, so the lecture tests were skipped."
          fi
      - name: Tests that need no lecture repo (PDF sources, PDF inbox)
        run: |
          python tools/test_sources.py --data data
          python tools/test_inbox.py --data data
      - name: Tests that need the lecture repo (merge rules, single writer, lecture picker + one-run pack)
        if: steps.lec.outputs.found == 'true'
        run: |
          python tools/selftest.py --data data --lectures lectures
          python tools/test_apply.py --data data --lectures lectures
          python tools/test_site.py --data data --lectures lectures
          python tools/test_oneshot.py --data data --lectures lectures --node-modules "$RUNNER_TEMP/node"
          python tools/test_quick.py --data data --lectures lectures --node-modules "$RUNNER_TEMP/node"
      - name: Register student lecture text (sources/<id>/*.md) in this checkout only, so the dry run can find it
        run: python tools/register_sources.py --data data --sources sources --config config
      - name: Dry-run merge_answers.py on replies/
        run: python tools/merge_answers.py --data data --lectures lectures --sources sources --replies replies > merge_report.txt 2>&1 || true
      - name: bot_db_tool verify + check_bot --strict
        run: |
          python tools/bot_db_tool.py verify data bot.db --no-media > verify_report.txt 2>&1 || true
          python tools/check_bot.py bot.db --strict > checkbot_report.txt 2>&1 || true
      - name: Combined report
        run: |
          {
            echo "## PR check report"; echo
            echo "### merge_answers.py (dry run on replies/)"; echo '```'; cat merge_report.txt; echo '```'; echo
            echo "### bot_db_tool.py verify"; echo '```'; cat verify_report.txt; echo '```'; echo
            echo "### check_bot.py --strict"; echo '```'; tail -n 60 checkbot_report.txt; echo '```'
          } > combined_report.md
          cat combined_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Post the report as a PR comment (PRs from this repo only)
        if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({ issue_number: context.issue.number, owner: context.repo.owner, repo: context.repo.repo, body: fs.readFileSync('combined_report.md', 'utf8') });
