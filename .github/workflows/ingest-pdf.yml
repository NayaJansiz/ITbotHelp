# Active root-level workflow. A PDF is ingested only after its inbox/ addition is merged into main.
name: ingest-pdf
on:
  push:
    branches: [main]
    paths:
      - 'IT-bot-guide-v2/inbox/**/*.pdf'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: ingest-pdf
  cancel-in-progress: false
jobs:
  ingest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: IT-bot-guide-v2
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pymupdf
      - name: PDF to lecture text and figure pages
        run: |
          set +e
          python tools/ingest_inbox.py --data data --inbox inbox --sources sources --config config --report report.md
          echo "INGEST_EXIT=$?" >> "$GITHUB_ENV"
          cat report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit ingested sources and configuration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A sources config inbox
          git diff --cached --quiet || git commit -m "sources: ingest lecture PDFs from inbox/" -m "$(head -n 12 report.md)"
          git pull --rebase origin main
          git push
      - name: Reprocess new sources through the single-writer workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run data-writer.yml
      - name: Fail the run if ingestion failed (PDF remains in inbox)
        run: test "${INGEST_EXIT:-0}" = "0"
